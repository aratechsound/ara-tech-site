name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository with validator baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run isolated Ubuntu Node 22 Security checks
        shell: bash
        env:
          ARA_CI_DEDICATED: node tests/validate-ara-20260724-010.cjs
          ARA_CI_VALIDATORS: tests/validate-ara-*.cjs
          ARA_CI_SYNTAX: node --check
          ARA_CI_WHITESPACE: git diff --check
        run: bash tests/ci/run-security-checks.sh

      - name: Save local fixture and validator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ara-ci-audit.*/
          if-no-files-found: warn
          retention-days: 7
