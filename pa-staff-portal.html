<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#007bff">
<title>イベント資料ポータル | ARA-TECH</title><link rel="icon" href="/img/favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/pa-case-portal.css?v=emp013-portal-parity">
<link rel="stylesheet" href="/pa-staff-portal.css"></head><body class="staff-portal-view">
<header class="portal-header"><div class="header-inner"><div class="brand"><img src="/img/ARA-TECH ロゴ横 白.png" alt="ARA-TECH"></div><span id="staff-language" class="portal-language"></span></div></header>
<main class="portal-shell">
<section id="staff-loading" class="portal-message"><p>イベント資料を読み込んでいます…</p></section><section id="staff-status" class="portal-message portal-message--error" hidden aria-live="polite"></section>
<section id="staff-content" hidden>

<section class="hero"><div class="hero-copy"><span class="kicker">EVENT DOCUMENT PORTAL</span><h1 id="portal-event-name">イベント資料ポータル</h1><p data-i18n="heroCopy">イベント運営資料の最新版と履歴を確認できます。</p><button id="staff-refresh" class="view-button" type="button"></button><p id="staff-grade-note" class="sample-note"></p></div><dl class="event-meta" aria-label="イベント基本情報"><div><dt data-i18n="date">開催日</dt><dd id="portal-date">未設定</dd></div><div><dt data-i18n="time">本番時間</dt><dd id="portal-time">未設定</dd></div><div><dt data-i18n="venue">会場</dt><dd><a id="portal-venue-map" class="venue-map-link" href="#" target="_blank" rel="noopener noreferrer" hidden><span id="portal-venue">未設定</span><span class="venue-map-mark" aria-hidden="true">↗</span></a><span id="portal-venue-plain">未設定</span><span id="portal-address" class="venue-address" hidden></span></dd></div></dl></section>
<section class="section fixed-documents"><div class="section-head"><div><h2 data-i18n="fixed">タイムテーブル・台本</h2><p data-i18n="fixedSub">固定枠には常に最新版を表示し、過去版はカード内の履歴から確認できます。</p></div></div><div class="grid2"><div id="timetable-content"></div><div id="script-content"></div></div></section>
<section class="section"><div class="section-head"><div><h2 data-i18n="layout">会場図・配置図</h2><p data-i18n="layoutSub">図面ごとに最新版と履歴をまとめています。</p></div></div><div id="layout-content" class="grid3"></div></section>
<section class="section"><div class="section-head"><div><h2 data-i18n="photos">会場・ステージ写真</h2><p data-i18n="photosSub">現調写真や会場写真を同じレベルで並べるギャラリーです。クリックで拡大できます。</p></div></div><div class="photo-album"><div id="photo-content" class="photo-grid"></div></div></section>
<section class="section"><div class="section-head"><div><h2 data-i18n="other">その他の共通資料</h2><p data-i18n="otherSub">上の分類に入らない共通資料をカード単位で確認できます。</p></div></div><div id="other-content" class="grid3"></div></section>
<section id="performer-section" class="section"><div class="section-head"><div><h2 data-i18n="performer">出演者資料</h2><p data-i18n="performerSub">出演順に資料が並びます。</p></div></div><div class="performer-wrap"><div id="performer-content" class="performer-list"></div></div></section>
</section></main>
<dialog id="staff-preview"><button id="staff-preview-close" type="button"></button><h2 id="staff-preview-title"></h2><div id="staff-preview-pages"></div></dialog><div id="portal-toast" class="portal-toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/pa-staff-portal.js?v=emp014-integration"></script></body></html>
