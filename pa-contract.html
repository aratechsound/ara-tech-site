<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><title>正式受注確認 | ARA-TECH</title><link rel="stylesheet" href="/pa-contract.css"><script src="/js/pa-contract.js" defer></script></head>
<body><header class="site-header"><div class="header-inner"><img src="/img/ara-tech-logo-horizontal-white.png" alt="ARA-TECH" width="2919" height="422"><span>お客様専用ページ</span></div></header>
<main class="contract-page"><div class="page-intro"><p class="eyebrow">ご依頼内容の確認</p><h1>正式受注確認</h1><p>お見積りとご依頼条件をご確認ください。</p></div>
<p id="status" role="status">確認内容を読み込んでいます。</p>
<section id="confirmation" hidden><dl id="summary"></dl><button id="quote" type="button" class="secondary">最終見積書PDFを確認</button><p id="quote-status" role="status"></p>
<h2>依頼内容</h2><p id="request" class="multiline"></p><h2>キャンセル条件</h2><div id="cancel" class="multiline"></div><h2>支払条件</h2><p id="payment" class="multiline"></p>
<h2>ご依頼にあたっての確認事項</h2><div id="business" class="terms multiline" role="region" aria-label="ご依頼にあたっての確認事項"></div>
<form id="accept-form"><label for="confirmer">確認者氏名</label><input id="confirmer" type="text" autocomplete="name" maxlength="120" required><label class="consent"><input id="agree" type="checkbox" required><span>上記内容を確認し、同意します</span></label><button id="submit" type="submit">この内容で正式に依頼する</button><p id="submission-status" role="status"></p></form>
</section><footer>この確認ページはご案内したお客様専用です。URLの転送・共有はお控えください。</footer></main></body></html>
